<!DOCTYPE html>
<html>
<head>
    <title>Terraform File Comparator</title>
</head>
<body>
    <h1>Upload Two Terraform Files to Compare</h1>
    <form method="POST" enctype="multipart/form-data">
        <label>File 1:</label><br>
        <input type="file" name="file1" required><br><br>

        <label>File 2:</label><br>
        <input type="file" name="file2" required><br><br>

        <input type="submit" value="Compare & Generate">
    </form>
</body>
</html>
